<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haushaltsbuch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .amount {
            text-align: right;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Haushaltsbuch</h1>
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Beschreibung</th>
                <th>Betrag (€)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>01.07.2026</td>
                <td>Miete</td>
                <td class="amount">-850,00</td>
            </tr>
            <tr>
                <td>03.07.2026</td>
                <td>Lebensmittel</td>
                <td class="amount">-125,50</td>
            </tr>
            <tr>
                <td>05.07.2026</td>
                <td>Gehalt</td>
                <td class="amount">+3.500,00</td>
            </tr>
            <tr>
                <td>10.07.2026</td>
                <td>Strom</td>
                <td class="amount">-89,90</td>
            </tr>
            <tr>
                <td>15.07.2026</td>
                <td>Internet</td>
                <td class="amount">-49,99</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
