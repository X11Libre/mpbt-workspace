# starfleetctl comms / opencode plugin configuration
# This file is managed by starfleetctl bootstrap --fix

comms:
  # Heartbeat interval in ms — how often the plugin writes health + touch
  # Default: 300000 (5 min)
  heartbeat_ms: 300000

  # Poll interval in ms — how often the plugin checks the inbox
  # Default: 3000 (3s)
  poll_ms: 1500

  # Fallback model for auto-recovery on zen-ratelimit / nim-overload.
  # When a ship's primary model is quota-blocked or overloaded, the plugin
  # switches to this model and resumes the session.
  fallback_model: nvidia/nemotron-3-ultra
