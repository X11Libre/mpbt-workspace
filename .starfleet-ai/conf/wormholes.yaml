wormholes:
  enabled: true

  sync:
    interval: "2s"
    startup_sync: true
    clone_timeout: "2m"
    command_timeout: "30s"
    push_retries: 3

  repositories:
    - id: "fleet-comms"
      remote: "git@github.com:metux/wormhole-0.git"
      branch: "master"
      enabled: true
      access: "read-write"

      incoming:
        enabled: true
        initial_scan: "baseline"
