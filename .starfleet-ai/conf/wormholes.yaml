# Wormhole manager configuration
# Enable wormhole manager (default: false)
enabled: false

# Sync configuration
sync:
  interval: "5s"           # Sync interval (e.g., "5s", "30s", "1m")
  startup_sync: true       # Run sync on startup
  clone_timeout: "2m"      # Timeout for clone operations
  command_timeout: "30s"   # Per-command timeout
  push_retries: 3          # Max push retries on non-fast-forward

# Repository configurations
repositories:
  - id: "fleet-comms"
    remote: "git@github.com:metux/wormhole-0.git"
    branch: "master"
    enabled: true
    access: "read-write"  # read-only or read-write

    incoming:
      enabled: true
      initial_scan: "baseline"  # baseline or replay
      messages:
        enabled: true
        paths:
          - "inbox/**/*.md"
        target_aliases:
          starfleetctl: "flagship"
          owner: "flagship"
        decisions:
          enabled: false
          paths:
            - "decisions/**/*.md"
          target: "flagship"

      outgoing:
        enabled: false
        paths:
          - "outbox/**/*.md"
        commit_message: "wormhole: publish outgoing messages"