#
# go-x11proto: Go X11-protocol client library + tools (xnamespace, go-xts).
#
# Cloned into _WORK_/go-x11proto/sources/xlibre/go-x11proto. The optional build
# just runs the repo's Makefile (default target builds the tools) via mpbt's
# `exec` builder — there is no autotools/meson here (pure Go). `make-pr.*` is
# configured so scripts/xx-make-pr.sh works from this clone too.

sources:
    git:
        ref:    origin/master
        remotes:
            origin:
                url:    ${xlibre_git}/go-x11proto.git
                fetch:
                  - refs/tags/*:refs/tags/origin/*
                  - refs/heads/*:refs/remotes/origin/*
                tagopt: --no-tags
        local-branch: master
        config:
            make-pr.upstream-remote: origin
            make-pr.upstream-branch: master
            make-pr.reviewers:       X11Libre/dev

buildsystem: exec
commands:
    build:
        - make
