#
# Standalone solution for the FlyingTux sister project.
#
# Deliberately SEPARATE from the xserver build: FlyingTux is only cloned here,
# never mixed into the xserver package set. Its sole build entry is
# xlibre/flyingtux below.

xlibre_git:     https://github.com/metux

install-prefix: ${@PROJECT::@workdir}/target

build:
    - xlibre/flyingtux

packages:
    - ${@PROJECT::@rootdir}/cf/flyingtux/packages

package-defaults:
    xlibre_git:     ${xlibre_git}
