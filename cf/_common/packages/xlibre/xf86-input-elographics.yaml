sources:
    git:
        ref:    origin/master
        remotes:
            origin:
                url:    ${xlibre_git}/${@basename}.git
                fetch:
                  - refs/tags/*:refs/tags/origin/*
                  - refs/heads/*:refs/remotes/origin/*
                tagopt: --no-tags
                # not an xorg driver
        local-branch: master
        config:
            make-pr.upstream-remote: origin
            make-pr.upstream-branch: master
            make-pr.reviewers:       X11Libre/dev

buildsystem: autotools

build-depends:
    - x11/xserver-sdk
    - 3rdparty/util-macros
